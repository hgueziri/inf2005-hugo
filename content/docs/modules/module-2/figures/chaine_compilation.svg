  </defs>
  <rect width="508" height="54" fill="#ffffff"/>
  <g fill="#e6f2ff" stroke="#0b2545" stroke-width="1.6">
    <rect x="4" y="4" width="110" height="46" rx="6"/>
    <rect x="134" y="4" width="110" height="46" rx="6"/>
    <rect x="264" y="4" width="110" height="46" rx="6"/>
    <rect x="394" y="4" width="110" height="46" rx="6"/>
