baseURL = 'https://hgueziri.github.io/inf2005-hugo/'
locale = 'fr'
defaultContentLanguage = 'fr'
title = 'INF 2005 – Programmation orientée objet avec C++'
theme = 'hugo-book'

[markup.highlight]
  style = 'github'      # couleurs des cellules de code

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4          # sections, sous-sections et sous-sous-sections

[params]
  BookSection = 'docs'  # les pages de content/docs/ forment le menu, dans l'ordre de leur weight
  BookTheme = 'light'   # les boîtes du cours sont prévues pour un fond clair
  BookToC = true        # table des matières à droite de chaque page
  BookSearch = true
